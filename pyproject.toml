[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossmind-ai"
version = "0.1.0"
description = "Reproducible pedestrian prediction research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
research = ["torch>=2.9,<3", "scikit-learn==1.7.2", "scipy==1.16.3"]
app = ["streamlit>=1.51,<2", "matplotlib>=3.10,<4", "pandas>=2.3,<4", "torch>=2.9,<3"]
video = ["ultralytics==8.4.196", "opencv-python>=4.11", "lap>=0.5"]
test = ["pytest>=8,<10", "torch>=2.9,<3", "scikit-learn==1.7.2", "scipy==1.16.3", "streamlit>=1.51,<2", "matplotlib>=3.10,<4"]

[project.scripts]
crossmind-baseline = "crossmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
